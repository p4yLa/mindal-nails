# Настройки Cloudflare Worker. Секреты сюда НЕ пишем — только через `wrangler secret put`:
# BOT_TOKEN, CHAT_ID, ADDRESS, ADDRESS_NOTE (адрес мастера не должен лежать в публичном репозитории).
name = "mindal-booking"
main = "index.js"
compatibility_date = "2026-10-01"

# База записей (Cloudflare D1, SQLite). В коде доступна как env.DB
# База создана: npx wrangler d1 create mindal
[[d1_databases]]
binding = "DB"
database_name = "mindal"
database_id = "f063a651-5b5f-4c0f-a2a7-af30ef5d62c2"
